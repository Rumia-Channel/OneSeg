[project]
name = "oneseg-sdr"
version = "0.1.0"
description = "DS-DT308SV Windows 11 SDR and one-segment ISDB-T research receiver"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pyrtlsdr[lib]>=0.3,<1",
  "PySide6>=6.8,<7",
  "pyqtgraph>=0.13,<1",
  "sounddevice>=0.5,<1",
  "reedsolo>=1.7,<2",
  "av>=15,<19",
]

[project.scripts]
oneseg = "oneseg.__main__:main"
oneseg-inspect = "oneseg.inspect:main"
oneseg-ofdm = "oneseg.ofdm:main"
oneseg-ts = "oneseg.ts_cli:main"
oneseg-doctor = "oneseg.diagnostics:main"
oneseg-capture = "oneseg.capture:main"
oneseg-quality = "oneseg.quality:main"
oneseg-lock = "oneseg.lock_probe:main"
oneseg-pilots = "oneseg.pilots:main"
oneseg-deinterleave = "oneseg.deinterleave:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oneseg"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
